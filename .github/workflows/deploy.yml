name: Deploy to bunny.net

on:
  push:
    branches:
      - main
    paths:
      - 'share/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CREDITS.md'
      - 'PRIVACY.md'
      - 'site/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bunny-deploy
  cancel-in-progress: false

jobs:
  deploy-share:
    uses: nichu42/shared-workflows/.github/workflows/deploy-bunny.yml@v1
    with:
      source_dir: share
      cdn_domain: share.boxviewer.app
    secrets:
      S3_ENDPOINT: ${{ secrets.BUNNY_S3_ENDPOINT }}
      S3_ZONE: ${{ secrets.BUNNY_S3_BUCKET }}
      S3_PASSWORD: ${{ secrets.BUNNY_S3_SECRET_KEY }}
      BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
      BUNNY_PULL_ZONE_ID: ${{ secrets.BUNNY_PULL_ZONE_ID }}

  deploy-site:
    uses: nichu42/shared-workflows/.github/workflows/deploy-bunny.yml@v1
    with:
      source_dir: site/dist
      build_command: python scripts/build_site.py
      cdn_domain: boxviewer.app
      cache_control: no-cache
      purge_list: index.html changelog.html credits.html privacy.html styles.css
    secrets:
      S3_ENDPOINT: ${{ secrets.HOMEPAGE_BUNNY_S3_ENDPOINT }}
      S3_ZONE: ${{ secrets.HOMEPAGE_BUNNY_S3_BUCKET }}
      S3_PASSWORD: ${{ secrets.HOMEPAGE_BUNNY_S3_SECRET_KEY }}
      BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
      BUNNY_PULL_ZONE_ID: ${{ secrets.HOMEPAGE_BUNNY_PULLZONE_ID }}



