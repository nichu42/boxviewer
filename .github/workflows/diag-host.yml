name: Capture rclone Host header

on:
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Install rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: "Capture Host header (raw endpoint, no pin)"
        env:
          ENDPOINT: ${{ secrets.HOMEPAGE_BUNNY_S3_ENDPOINT }}
          ACCESS: ${{ secrets.HOMEPAGE_BUNNY_S3_ACCESS_KEY }}
          SECRET: ${{ secrets.HOMEPAGE_BUNNY_S3_SECRET_KEY }}
          BUCKET: ${{ secrets.HOMEPAGE_BUNNY_S3_BUCKET }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [bunny]
          type = s3
          provider = Other
          env_auth = false
          access_key_id = ${ACCESS}
          secret_access_key = ${SECRET}
          endpoint = ${ENDPOINT}
          force_path_style = true
          acl = private
          EOF
          echo "=== lsd with --dump headers ==="
          timeout 90 rclone lsd "bunny:${BUCKET}" --fast-list --dump headers 2>&1 | grep -iE "Host:|GET |PUT |HTTPS|tls:|x-amz-bucket" | head -20
          echo "EXIT: $?"
